spring:
  application:
    name: llm-gateway
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      # 지연 연결: redis 백엔드가 아니면 연결하지 않는다.

server:
  port: 8080

gateway:
  # 환경변수 LLM_PROVIDER 로 기본 공급자 지정 (anthropic | openai | fake). 미설정 시 fake.
  default-provider: ${LLM_PROVIDER:fake}
  context-window-tokens: 200000
  reserve-output-tokens: 4096
  # 레이트 리밋: 클라이언트(X-Client-Id)당 토큰 버킷.
  # 백엔드: memory(프로세스 로컬) | redis(분산).
  rate-limit-backend: ${RATE_LIMIT_BACKEND:memory}
  rate-limit-capacity: 20
  rate-limit-refill-per-second: 5.0
  # 백엔드 장애 시 정책: fail-open(가용성 우선) | fail-closed(비용 보호).
  rate-limit-on-backend-error: fail-open
  # 시맨틱 캐시: 유사 프롬프트 응답 재사용. 기본 로컬 해싱 임베더(키 불필요).
  cache-enabled: ${CACHE_ENABLED:false}
  cache-similarity-threshold: 0.97
  cache-max-entries: 1000
  # 공급자 회복탄력성: 흩어진 타임아웃/재시도를 게이트웨이가 집약한다.
  # connect: TCP 연결 상한. response: 응답(헤더) 수신 상한(스트림 시작 후 해제).
  # read-idle: 읽기 유휴 상한(헤더 수신 후 스트림 hang 차단).
  # max-retries/backoff: 일시적 오류(타임아웃/5xx/연결거부) 한정 지수 백오프 재시도.
  provider-connect-timeout-millis: ${PROVIDER_CONNECT_TIMEOUT_MS:2000}
  provider-response-timeout-millis: ${PROVIDER_RESPONSE_TIMEOUT_MS:30000}
  provider-read-idle-timeout-millis: ${PROVIDER_READ_IDLE_TIMEOUT_MS:60000}
  provider-max-retries: ${PROVIDER_MAX_RETRIES:2}
  provider-retry-backoff-millis: ${PROVIDER_RETRY_BACKOFF_MS:200}

anthropic:
  # BYO-key: 레포에 값이 없다. .env 또는 환경변수로만 주입한다.
  api-key: ${ANTHROPIC_API_KEY:}
  model: ${ANTHROPIC_MODEL:claude-opus-4-8}
  base-url: https://api.anthropic.com

openai:
  # BYO-key: 레포에 값이 없다.
  api-key: ${OPENAI_API_KEY:}
  model: ${OPENAI_MODEL:gpt-4o-mini}
  base-url: https://api.openai.com

gemini:
  # BYO-key: 레포에 값이 없다.
  api-key: ${GEMINI_API_KEY:}
  model: ${GEMINI_MODEL:gemini-2.0-flash}
  base-url: https://generativelanguage.googleapis.com

management:
  endpoints:
    web:
      exposure:
        # 관측 대시보드: 헬스 + 메트릭 + 프로메테우스 스크레이프.
        include: health,info,metrics,prometheus
  health:
    redis:
      # Redis 는 선택 백엔드(rate-limit-backend=redis 일 때만 사용).
      # 미사용 시 Redis ping 실패가 전체 헬스를 끌어내리지 않게 끈다.
      enabled: false

logging:
  level:
    com.llmgateway: INFO
